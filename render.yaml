services:
  - type: web
    name: expenseflow-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expenseflow-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        value: prod-jwt-secret-key-change-in-dashboard-32hex
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHONPATH
        value: /app

  - type: static
    name: expenseflow-frontend
    build:
      buildCommand: ls frontend/
    publishPath: frontend
    autoDeploy: true

databases:
  - name: expenseflow-postgres
    databaseName: expenseflow_db
    user: postgres
    region: oregon
    plan: free
