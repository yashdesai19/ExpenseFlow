services:
  - type: web
    name: expenseflow-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    pythonVersion: "3.12"
    startCommand: cd backend && export PYTHONPATH=. && echo "DEBUG DATABASE_URL=$DATABASE_URL" && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expenseflow-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        value: prod-jwt-secret-key-change-in-dashboard-32hex
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"

  - type: static
    name: expenseflow-frontend
    build:
      buildCommand: ls frontend/
    publishPath: frontend
    autoDeploy: true

databases:
  - name: expenseflow-postgres
    databaseName: expenseflow_db
    user: expenseflow
    region: oregon
    plan: free