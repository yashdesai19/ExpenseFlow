services:
  - type: web
    name: expenseflow-backend
    runtime: docker
    build:
      dockerfilePath: backend/Dockerfile
      dockerContext: backend
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expenseflow-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        value: prod-jwt-secret-key-change-in-dashboard-32hex
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHONPATH
        value: /app

  - type: web
    name: expenseflow-frontend
    runtime: static
    build:
      buildCommand: cp -r frontend/* .
      publishPath: frontend
    autoDeploy: true

databases:
  - name: expenseflow-postgres
    databaseName: expenseflow_db
    user: postgres
    region: oregon
