<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In &mdash; ExpenseFlow Pro</title>
<meta name="description" content="Sign in or create your ExpenseFlow Pro account to manage expenses, budgets, and cash flow.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<!-- Shared Design Tokens -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<style>
/* ============================================================
   AUTH PAGE
   ============================================================ */
.auth-page {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  background: var(--bg);
}

.theme-toggle-auth {
  position:absolute; top:24px; right:24px;
  width:36px; height:36px; border-radius:10px;
  border:1px solid var(--border-strong);
  background:var(--bg); cursor:pointer;
  font-size:16px; display:flex; align-items:center; justify-content:center;
  transition:all 150ms ease; color:var(--text-muted);
  z-index: 10;
}
.theme-toggle-auth:hover { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

/* --- Tabs --- */
.auth-tabs {
  display:flex; gap:4px;
  background:var(--bg); border-radius:12px;
  padding:4px; margin-bottom:28px;
  border:1px solid var(--border);
}
.auth-tab-btn {
  flex:1; padding:10px; border:none; border-radius:9px;
  background:transparent; color:var(--text-muted);
  font-family:var(--font-sans); font-size:14px; font-weight:600;
  cursor:pointer; transition:all 200ms ease;
}
.auth-tab-btn.active {
  background:var(--bg-elevated); color:var(--text);
  box-shadow:0 2px 8px rgba(32,29,24,0.1);
}
[data-theme="dark"] .auth-tab-btn.active {
  background:var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.auth-heading    { font-family:var(--font-serif); font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.02em; margin-bottom:6px; }
.auth-subheading { font-size:14px; color:var(--text-muted); margin-bottom:24px; }

/* --- Form --- */
.auth-form { display:flex; flex-direction:column; gap:15px; }

.form-field { display:flex; flex-direction:column; gap:6px; }
.form-label { font-size:13px; font-weight:600; color:var(--text-sec); letter-spacing:0.01em; }

.form-input {
  width:100%; padding:11px 14px;
  background:var(--bg);
  border:1.5px solid var(--border-strong);
  border-radius:10px;
  font-family:var(--font-sans); font-size:14.5px; color:var(--text);
  outline:none;
  transition:border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
}
.form-input::placeholder { color:var(--text-muted); font-size:14px; }
.form-input:focus {
  border-color:var(--accent);
  background:var(--bg-elevated);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.input-wrap { position:relative; }
.input-wrap .form-input { padding-right:44px; }
.pw-toggle {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  color:var(--text-muted); font-size:16px; padding:4px; line-height:1;
  transition:color 150ms;
}
.pw-toggle:hover { color:var(--accent); }

.btn-auth-submit {
  width:100%; padding:13px;
  background:linear-gradient(135deg, var(--accent), var(--accent-bright));
  color:#fff; border:none; border-radius:10px;
  font-family:var(--font-sans); font-size:15px; font-weight:700;
  cursor:pointer; margin-top:4px;
  transition:all 200ms ease; position:relative; overflow:hidden;
  box-shadow:0 4px 14px rgba(169,121,63,0.3);
}
.btn-auth-submit:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(169,121,63,0.4); }
.btn-auth-submit:active:not(:disabled){ transform:translateY(0); }
.btn-auth-submit:disabled { opacity:0.65; cursor:not-allowed; }
.btn-auth-submit .btn-spinner {
  display:inline-block; width:16px; height:16px;
  border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
  border-radius:50%; animation:spin 0.7s linear infinite;
  vertical-align:middle; margin-right:6px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Alert */
.auth-alert {
  padding:12px 14px; border-radius:10px;
  font-size:13.5px; font-weight:500;
  display:none; animation:slideIn 200ms ease;
  margin-bottom:8px;
}
@keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.auth-alert.error {
  display:flex; align-items:flex-start; gap:8px;
  background:var(--danger-soft); color:var(--danger);
  border:1px solid rgba(177,72,52,0.2);
}
.auth-alert.success {
  display:flex; align-items:flex-start; gap:8px;
  background:var(--success-soft); color:var(--success);
  border:1px solid rgba(47,122,84,0.2);
}

/* Switch link */
.auth-switch { text-align:center; font-size:13.5px; color:var(--text-muted); margin-top:18px; }
.auth-switch a { color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer; }
.auth-switch a:hover { text-decoration:underline; }

/* Password strength */
.pw-strength-bar  { height:3px; border-radius:99px; background:var(--border); margin-top:6px; overflow:hidden; }
.pw-strength-fill { height:100%; border-radius:99px; width:0%; transition:width 300ms ease, background 300ms ease; }
.pw-strength-label{ font-size:11px; color:var(--text-muted); margin-top:4px; }

/* Helpers */
.d-none { display:none !important; }

.mobile-brand {
  display:flex; align-items:center; gap:12px; margin-bottom:28px;
}
.hero-icon {
  width:44px; height:44px;
  background: linear-gradient(135deg, #C9A467, #A9793F);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-serif); font-size:18px; font-weight:700;
  color:#1A160F; flex-shrink:0;
  box-shadow: 0 4px 16px rgba(169,121,63,0.4);
}
</style>
</head>

<body class="mobile-center-frame">
  <div class="ledger-shell" style="padding: 40px 24px 60px; overflow-y: auto; justify-content: flex-start; display: flex; flex-direction: column;">

    <button class="theme-toggle-auth" id="authThemeToggle" onclick="toggleTheme()" title="Toggle theme">&#127769;</button>

    <!-- Mobile brand -->
    <div class="mobile-brand">
      <div class="hero-icon">EF</div>
      <div>
        <div style="font-family:var(--font-serif);font-size:18px;font-weight:700;color:var(--text);">ExpenseFlow Pro</div>
        <div style="font-size:12px;color:var(--text-muted);">The Ledger Workspace</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab-btn active" id="tab-login"    role="tab" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab-btn"        id="tab-register" role="tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- ========== LOGIN ========== -->
    <div id="login-section">
      <h2 class="auth-heading">Welcome back</h2>
      <p class="auth-subheading">Sign in to your ExpenseFlow Pro account</p>

      <div id="login-alert" class="auth-alert" role="alert"></div>

      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)" novalidate>
        <div class="form-field">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)">&#128065;&#65039;</button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="login-btn">Sign In to Dashboard</button>
      </form>

      <p class="auth-switch">Don't have an account? <a onclick="switchTab('register')">Create one free</a></p>
    </div>

    <!-- ========== REGISTER ========== -->
    <div id="register-section" class="d-none">
      <h2 class="auth-heading">Create account</h2>
      <p class="auth-subheading">Start managing your expenses today &mdash; it&apos;s free</p>

      <div id="register-alert" class="auth-alert" role="alert"></div>

      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)" novalidate>
        <div class="form-field">
          <label class="form-label" for="reg-name">Full Name</label>
          <input class="form-input" type="text" id="reg-name" placeholder="Arjun Sharma" autocomplete="name" required>
        </div>

        <div class="form-field">
          <label class="form-label" for="reg-email">Email Address</label>
          <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password" required oninput="updatePwStrength(this.value)">
            <button type="button" class="pw-toggle" onclick="togglePw('reg-password',this)">&#128065;&#65039;</button>
          </div>
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
          <div class="pw-strength-label" id="pw-label"></div>
        </div>

        <div class="form-field">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" onclick="togglePw('reg-confirm',this)">&#128065;&#65039;</button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="register-btn">Create My Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a onclick="switchTab('login')">Sign in here</a></p>
    </div>

  </div>

<script>
/* ============================================================
   AUTH PAGE — JAVASCRIPT
   ============================================================ */

// API base URL — works on localhost, phone (same WiFi), or when served from :8080
const API_BASE = (() => {
  const h = window.location.hostname;
  const o = window.location.origin;
  
  // If running on local development (non-production ports/localhost)
  if (!h || h === 'localhost' || h === '127.0.0.1') {
    if (o.includes(':3001')) return `http://${h}:8081/api/v1`;
    if (o.includes(':8081')) return o + '/api/v1';
    return 'http://127.0.0.1:8081/api/v1';
  }
  
  // If hosted on a separate static frontend site on Render, point to the deployed backend URL
  if (h.includes('frontend') || h.includes('static') || h.includes('1add') === false) {
    return 'https://expenseflow-1add.onrender.com/api/v1';
  }
  
  // Served from the backend origin itself (via /ui mount)
  return o + '/api/v1';
})();

const TOKEN_KEY = 'expenseflow_auth_token';
const USER_KEY  = 'expenseflow_auth_user';

// ---- Theme ----
function applyTheme() {
  const saved = localStorage.getItem('ef_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('authThemeToggle').innerHTML = saved === 'dark' ? '&#9728;&#65039;' : '&#127769;';
}
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ef_theme', next);
  document.getElementById('authThemeToggle').innerHTML = next === 'dark' ? '&#9728;&#65039;' : '&#127769;';
}
applyTheme();

// ---- Auto-redirect if already logged in ----
(function checkAuth() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;
  fetch(`${API_BASE}/auth/me`, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => { if (r.ok) redirectToApp(); else { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); } })
    .catch(() => {});
})();

function redirectToApp() {
  window.location.href = 'index.html';
}

// ---- Tab Switcher ----
function switchTab(tab) {
  const isLogin = (tab === 'login');
  document.getElementById('login-section').classList.toggle('d-none', !isLogin);
  document.getElementById('register-section').classList.toggle('d-none', isLogin);
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  clearAlerts();
}

function clearAlerts() {
  ['login-alert', 'register-alert'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'auth-alert';
    el.textContent = '';
  });
}

function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `auth-alert ${type}`;
  el.innerHTML = (type === 'error' ? '&#10060; ' : '&#9989; ') + msg;
}

// ---- Password Toggle ----
function togglePw(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === 'password') { inp.type = 'text';     btn.innerHTML = '&#128584;'; }
  else                         { inp.type = 'password'; btn.innerHTML = '&#128065;&#65039;'; }
}

// ---- Password Strength ----
function updatePwStrength(pw) {
  const fill  = document.getElementById('pw-fill');
  const label = document.getElementById('pw-label');
  if (!pw) { fill.style.width='0%'; label.textContent=''; return; }
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { w:'20%', c:'#D97C6B', t:'Very weak' },
    { w:'40%', c:'#D97C6B', t:'Weak' },
    { w:'60%', c:'#D9A441', t:'Fair' },
    { w:'80%', c:'#5FAE82', t:'Strong' },
    { w:'100%',c:'#5FAE82', t:'Very strong' },
  ];
  const lvl = levels[Math.min(score - 1, 4)] || levels[0];
  fill.style.width = lvl.w;
  fill.style.background = lvl.c;
  label.textContent = lvl.t;
  label.style.color = lvl.c;
}

// ---- Loading state ----
function setLoading(btnId, loading, originalText) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="btn-spinner"></span> Please wait...'
    : originalText;
}

// ---- LOGIN ----
async function handleLogin(e) {
  e.preventDefault();
  clearAlerts();
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showAlert('login-alert','error','Please fill in all fields.'); return; }

  setLoading('login-btn', true, 'Sign In to Dashboard');
  try {
    const res  = await fetch(`${API_BASE}/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showAlert('login-alert','error', data?.detail || 'Invalid credentials. Please try again.');
      return;
    }
    localStorage.setItem(TOKEN_KEY, data.access_token);
    if (data.user) localStorage.setItem(USER_KEY, JSON.stringify(data.user));
    showAlert('login-alert','success','Login successful! Redirecting...');
    setTimeout(redirectToApp, 800);
  } catch {
    showAlert('login-alert','error','Cannot connect to server. Make sure the backend is running.');
  } finally {
    setLoading('login-btn', false, 'Sign In to Dashboard');
  }
}

// ---- REGISTER ----
async function handleRegister(e) {
  e.preventDefault();
  clearAlerts();
  const full_name = document.getElementById('reg-name').value.trim();
  const email     = document.getElementById('reg-email').value.trim();
  const password  = document.getElementById('reg-password').value;
  const confirm   = document.getElementById('reg-confirm').value;

  if (!full_name || !email || !password || !confirm) { showAlert('register-alert','error','Please fill in all fields.'); return; }
  if (password.length < 8) { showAlert('register-alert','error','Password must be at least 8 characters.'); return; }
  if (password !== confirm) { showAlert('register-alert','error','Passwords do not match.'); return; }

  setLoading('register-btn', true, 'Create My Account');
  try {
    const res  = await fetch(`${API_BASE}/auth/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ full_name, email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      let msg = data?.detail || data?.errors?.[0] || 'Registration failed. Please try again.';
      showAlert('register-alert','error', msg);
      return;
    }
    showAlert('register-alert','success','Account created! Signing you in...');

    // Auto-login
    setTimeout(async () => {
      try {
        const lr   = await fetch(`${API_BASE}/auth/login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const ld = await lr.json();
        if (lr.ok) {
          localStorage.setItem(TOKEN_KEY, ld.access_token);
          if (ld.user) localStorage.setItem(USER_KEY, JSON.stringify(ld.user));
          redirectToApp();
        } else {
          switchTab('login');
          document.getElementById('login-email').value = email;
          showAlert('login-alert','success','Account created! Please sign in.');
        }
      } catch {
        switchTab('login');
        document.getElementById('login-email').value = email;
      }
    }, 1000);
  } catch {
    showAlert('register-alert','error','Cannot connect to server. Make sure the backend is running.');
  } finally {
    setLoading('register-btn', false, 'Create My Account');
  }
}

// Open register tab if URL has ?tab=register
if (new URLSearchParams(window.location.search).get('tab') === 'register') {
  switchTab('register');
}
</script>
</body>
</html>
